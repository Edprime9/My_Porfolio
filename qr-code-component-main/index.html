<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <style>
      /* ---------- Base styles ---------- */

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background-color: hsl(212, 45%, 89%);
        font-family: "Outfit", sans-serif;
      }

      /* ---------- QR Code Card ---------- */

      .qr-card {
        width: 100%;
        max-width: 320px;
        padding: 16px;

        background-color: hsl(0, 0%, 100%);
        border-radius: 16px;

        text-align: center;
      }

      .qr-code {
        display: block;
        width: 100%;
        border-radius: 10px;
      }

      .qr-content {
        padding: 20px 10px 10px;
      }

      .qr-content h1 {
        color: hsl(218, 44%, 22%);
        font-size: 1.4rem;
        line-height: 1.3;
        margin-bottom: 15px;
      }

      .qr-content p {
        color: hsl(220, 15%, 55%);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      /* ---------- Footer ---------- */

      .attribution {
        margin-top: 20px;
        font-size: 0.6875rem;
        text-align: center;
      }

      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>

  <body>
    <main class="qr-card">
      <img
        src="./images/image-qr-code.png"
        alt="QR code linking to Frontend Mentor"
        class="qr-code"
      />

      <div class="qr-content">
        <h1>Improve your front-end skills by building projects</h1>

        <p>
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level.
        </p>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        rel="noopener noreferrer"
      >
        Frontend Mentor </a
      >. Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
